services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smartcs-agent-postgres
    environment:
      POSTGRES_DB: smartcs_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: smartcs_agent_pwd
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartcs_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smartcs-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: smartcs-agent-neo4j
    environment:
      NEO4J_AUTH: neo4j/smartcs_agent_neo4j_pwd
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  app:
    build: .
    container_name: smartcs-agent-app
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: smartcs_agent_pwd
      DB_NAME: smartcs_agent
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PASSWORD: ""
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: smartcs_agent_neo4j_pwd
      NEO4J_DATABASE: neo4j
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - app_logs:/app/llm_backend/logs
      - app_uploads:/app/llm_backend/uploads

volumes:
  pg_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  app_logs:
  app_uploads:
