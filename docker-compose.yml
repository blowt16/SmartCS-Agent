services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smartcs-agent-postgres
    environment:
      POSTGRES_DB: smartcs_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: smartcs_agent_pwd
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartcs_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smartcs-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: smartcs-agent-app
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: smartcs_agent_pwd
      DB_NAME: smartcs_agent
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PASSWORD: ""
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_logs:/app/llm_backend/logs
      - app_uploads:/app/llm_backend/uploads

volumes:
  pg_data:
  redis_data:
  app_logs:
  app_uploads:
